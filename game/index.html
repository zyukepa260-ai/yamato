<title>法廷の選択</title>
<meta name="description" content="有名判例をもとにした民法・民事訴訟法の法廷シミュレーションゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 一画面のビジュアルノベル。上=期日情報と心証メーター、中=法廷の舞台、下=発言ウィンドウ。単一の「夜の法廷（胡桃材）」の世界観で固定。 */
:root{
  --walnut:#1c1714;      /* 地: 法廷の胡桃材を暗くしたもの */
  --panel:#26201b;       /* 面: 発言ウィンドウ・パネル */
  --panel-2:#2f2721;
  --line:#4a3d33;
  --oak:#8a6446;         /* 法壇の木 */
  --paper:#f1ebe0;       /* 書面（訴状・判決書） */
  --paper-ink:#24201c;
  --fg:#ece4d8;
  --muted:#b3a593;
  --verdigris:#6fb3a0;   /* アクセント: 緑青 */
  --brass:#d2ac62;       /* メーター・弁護士バッジ */
  --good:#7cc4a4; --ok:#8fb2d8; --meh:#e0b45c; --bad:#e07a6b;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--walnut);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}
#app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 20px;min-height:100%;display:flex;flex-direction:column;gap:10px}

/* ---------- タイトル画面 ---------- */
.title-wrap{display:grid;gap:22px;padding-block:24px}
.title-mark{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.title-mark h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,72px);letter-spacing:.08em;margin:0;line-height:1.1}
.title-mark .sub{font-family:var(--f-display);color:var(--muted);letter-spacing:.2em;font-size:14px}
.lede{max-width:62ch;color:var(--muted);margin:0}
.chapters{display:grid;gap:12px}
.chap{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;text-align:left;cursor:pointer;transition:border-color .2s,background .2s}
.chap:hover{border-color:var(--oak);background:var(--panel-2)}
.chap .no{font-family:var(--f-display);font-size:30px;color:var(--oak);font-weight:800;min-width:2.2em;text-align:center}
.chap h3{margin:0;font-family:var(--f-display);font-size:19px;letter-spacing:.04em}
.chap .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.chap .case{font-size:12.5px;color:var(--verdigris);margin-top:4px}
.chap .best{font-family:var(--f-display);font-size:26px;min-width:1.6em;text-align:center;color:var(--brass)}
.chap .best small{display:block;font-family:var(--f-body);font-size:10px;color:var(--muted);letter-spacing:.1em}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-size:13px;color:var(--muted)}
.howto div{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.howto b{color:var(--fg);display:block;font-weight:700}
.disclaimer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

/* ---------- HUD ---------- */
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.hud .where{min-width:0}
.hud .court{font-family:var(--f-display);font-size:14px;letter-spacing:.06em}
.hud .date{font-size:12px;color:var(--muted)}
.meters{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.meter{display:grid;gap:2px;font-size:11px;color:var(--muted);letter-spacing:.06em;min-width:120px}
.meter .bar{height:6px;background:#3a302a;border-radius:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--brass);transition:width .6s ease}
.meter.trust .bar i{background:var(--verdigris)}
.hud-btns{display:flex;gap:6px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:4px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--oak)}

/* ---------- 舞台 ---------- */
.stage{position:relative;aspect-ratio:16/8;max-width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#120f0d}
.stage.slim{aspect-ratio:16/3.2}
.stage svg.bg{position:absolute;inset:0;width:100%;height:100%}
.stage .place{position:absolute;left:12px;top:10px;font-family:var(--f-display);font-size:13px;letter-spacing:.12em;background:rgba(20,16,13,.72);border:1px solid var(--line);padding:2px 10px;border-radius:3px}
.portrait{position:absolute;bottom:0;height:88%;aspect-ratio:200/240;transition:opacity .25s,transform .25s}
.portrait.right{right:4%}
.portrait.left{left:4%}
.portrait.hide{opacity:0;transform:translateY(6px)}
.portrait svg{width:100%;height:100%;display:block}

/* ---------- 発言ウィンドウ ---------- */
.box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px 14px;min-height:150px;cursor:pointer}
.box .name{position:absolute;top:-13px;left:14px;background:var(--oak);color:#fff8ee;font-family:var(--f-display);font-weight:700;font-size:14px;padding:1px 12px;border-radius:3px;letter-spacing:.08em}
.box .name small{font-family:var(--f-body);font-weight:400;font-size:11px;opacity:.85;margin-left:6px}
.box .text{font-size:16px;line-height:1.95;white-space:pre-wrap;max-width:68ch}
.box .text.narr{color:var(--muted)}
.box .next{position:absolute;right:14px;bottom:8px;font-size:11px;color:var(--muted);letter-spacing:.1em}
.box .next::after{content:" ▼";animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

/* ---------- 書面 ---------- */
.doc{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:20px 22px;font-family:var(--f-display);line-height:1.9;box-shadow:0 10px 30px rgba(0,0,0,.35);max-height:62vh;overflow:auto}
.doc h4{text-align:center;font-size:20px;letter-spacing:.5em;margin:0 0 6px;font-weight:800}
.doc .caseline{text-align:center;font-size:12.5px;margin-bottom:12px;font-family:var(--f-body)}
.doc p{margin:.4em 0;font-size:15px}
.doc .sec{font-weight:800;margin-top:.9em}
.doc .stamp{display:inline-block;border:2px solid #b0392f;color:#b0392f;border-radius:50%;padding:6px 8px;font-size:12px;transform:rotate(-8deg);margin-left:8px}

/* ---------- 選択肢 ---------- */
.choice{display:grid;gap:12px}
.choice .q{font-family:var(--f-display);font-size:17px;line-height:1.7;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--verdigris);padding:12px 16px;border-radius:4px}
.choice .q .kind{display:inline-block;font-family:var(--f-body);font-size:11px;letter-spacing:.12em;color:var(--verdigris);border:1px solid var(--verdigris);border-radius:2px;padding:0 6px;margin-right:8px;vertical-align:2px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:2em 1fr;gap:8px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:11px 14px;cursor:pointer;line-height:1.7;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--brass);transform:translateX(2px)}
.opt .k{font-family:var(--f-display);font-weight:800;color:var(--brass)}
.opt span{min-width:0}

/* ---------- 解説 ---------- */
.fb{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;gap:10px}
.fb .head{display:flex;align-items:center;gap:12px}
.fb .mark{font-family:var(--f-display);font-size:34px;line-height:1;width:1.2em;text-align:center}
.fb .verdict{font-family:var(--f-display);font-size:18px;font-weight:700}
.fb .delta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fb .pick{font-size:13.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.fb .exp{max-width:70ch;white-space:pre-wrap}
.laws{display:flex;flex-wrap:wrap;gap:6px}
.law{font-size:12px;border:1px solid var(--verdigris);color:var(--verdigris);border-radius:2px;padding:0 7px}
.g-best{color:var(--good)} .g-ok{color:var(--ok)} .g-meh{color:var(--meh)} .g-bad{color:var(--bad)}
.primary{justify-self:end;background:var(--oak);color:#fff8ee;border:0;border-radius:4px;padding:8px 20px;font-family:var(--f-display);font-weight:700;letter-spacing:.1em;cursor:pointer}
.primary:hover{filter:brightness(1.1)}

/* ---------- 判決・結果 ---------- */
.result{display:grid;gap:16px}
.result .big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,56px);letter-spacing:.2em;text-align:center;margin:6px 0 0}
.big.win{color:var(--good)} .big.mid{color:var(--meh)} .big.lose{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 14px}
.stat .l{font-size:11px;color:var(--muted);letter-spacing:.1em}
.stat .v{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.review{display:grid;gap:6px}
.review .row{display:grid;grid-template-columns:1.6em 1fr;gap:8px;font-size:13.5px;border-bottom:1px solid var(--line);padding-block:6px}
.review .row div{min-width:0}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 18px}
.notes h4{margin:0 0 6px;font-family:var(--f-display)}
.notes li{margin-bottom:6px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- モーダル ---------- */
.modal{position:fixed;inset:0;background:rgba(8,6,5,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;max-width:720px;width:100%;max-height:84vh;overflow:auto;padding:18px 20px}
.modal h3{margin:0 0 10px;font-family:var(--f-display)}
.modal dl{margin:0;display:grid;gap:10px}
.modal dt{font-weight:700;color:var(--verdigris)}
.modal dd{margin:2px 0 0;color:var(--fg);font-size:14px}
.logline{font-size:13.5px;border-bottom:1px solid var(--line);padding-block:5px}
.logline b{color:var(--brass);font-weight:500;margin-right:6px}

.fade-in{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
  .stage{aspect-ratio:16/10}
  .box .text{font-size:15px}
  .chap{grid-template-columns:auto 1fr}
  .chap .best{grid-column:2;text-align:left}
  .meter{min-width:96px}
}
</style>

<div id="app"></div>

<script>
"use strict";
/* =====================================================================
   キャラクター
   ===================================================================== */
const CAST = {
  me:      {name:"朝倉 遥", role:"弁護士（1年目）", skin:"#e9c9a8", hair:"#2a201b", style:"bob", attire:"#2d3442", badge:true},
  boss:    {name:"鷹野 誠一郎", role:"所長弁護士", skin:"#e2c09c", hair:"#bdb6ad", style:"swept", attire:"#3a3330", badge:true, glasses:true},
  clerk:   {name:"野々村", role:"裁判所書記官", skin:"#ecccad", hair:"#3b2c22", style:"short", attire:"#4a4f57"},
  // 第1章
  j1:      {name:"三宅 澄江", role:"裁判官・東京地裁民事第28部", skin:"#ebcaa9", hair:"#231b17", style:"long", attire:"#111", robe:true, glasses:true},
  opp1:    {name:"黒須 剛", role:"原告代理人弁護士", skin:"#d9b38f", hair:"#151210", style:"slick", attire:"#1d1f26", badge:true},
  c1:      {name:"坂本 源治", role:"依頼人・株式会社坂本青果 代表取締役", skin:"#d7ad86", hair:"#6f6a64", style:"crop", attire:"#5b6b4b"},
  p1:      {name:"大河内 正臣", role:"原告・建物所有者", skin:"#e0bd98", hair:"#d8d4ce", style:"bald", attire:"#5a4636"},
  // 第2章
  j2:      {name:"北条 隆", role:"裁判長・横浜地裁第6民事部", skin:"#e3c19d", hair:"#8d877f", style:"swept", attire:"#111", robe:true},
  opp2:    {name:"入江 千尋", role:"原告代理人弁護士", skin:"#efd1b2", hair:"#3a241a", style:"long", attire:"#2c2730", badge:true, glasses:true},
  c2:      {name:"藤堂 聡", role:"依頼人・被告", skin:"#e4c19e", hair:"#1e1915", style:"short", attire:"#3e4a5c"},
  p2:      {name:"白石 和枝", role:"原告", skin:"#efd3b8", hair:"#cfc8c2", style:"bun", attire:"#6a4f5e"},
  makabe:  {name:"真壁 光男", role:"元不動産業者", skin:"#d8b28c", hair:"#2b2420", style:"slick", attire:"#4b4038"},
  // 第3章
  j3:      {name:"葛西 恭平", role:"裁判官・さいたま地裁第4民事部", skin:"#e5c3a0", hair:"#1b1714", style:"crop", attire:"#111", robe:true, glasses:true},
  opp3:    {name:"権藤 達也", role:"被告代理人弁護士", skin:"#d6ae88", hair:"#2a2622", style:"swept", attire:"#262a22", badge:true},
  c3:      {name:"森川 早苗", role:"依頼人・原告", skin:"#efcfae", hair:"#2c1f19", style:"bob", attire:"#58705f"},
  tadokoro:{name:"田所 義男", role:"本件土地の元所有者", skin:"#d5ac85", hair:"#e3dfd9", style:"bald", attire:"#5d5446"},
  arima:   {name:"有馬 健吾", role:"被告・不動産仲介業", skin:"#dcb48d", hair:"#0f0d0c", style:"slick", attire:"#3b2a3f"},
};

function hairPath(style, c){
  switch(style){
    case "bob":   return `<path d="M58 104 Q54 52 100 48 Q146 52 142 104 L142 128 Q136 132 132 126 L132 92 Q118 72 100 72 Q80 72 68 92 L68 126 Q64 132 58 128 Z" fill="${c}"/>`;
    case "long":  return `<path d="M56 110 Q52 50 100 46 Q148 50 144 110 L148 176 Q136 182 130 168 L132 96 Q118 74 100 74 Q82 74 68 96 L70 168 Q64 182 52 176 Z" fill="${c}"/>`;
    case "bun":   return `<circle cx="100" cy="46" r="16" fill="${c}"/><path d="M62 100 Q60 58 100 56 Q140 58 138 100 Q130 78 100 76 Q70 78 62 100 Z" fill="${c}"/>`;
    case "swept": return `<path d="M62 98 Q58 56 104 52 Q142 54 140 92 Q128 70 100 72 Q82 70 72 82 Q66 90 62 98 Z" fill="${c}"/>`;
    case "slick": return `<path d="M62 96 Q62 54 100 52 Q140 54 138 96 Q132 74 112 70 Q92 66 74 76 Q66 84 62 96 Z" fill="${c}"/>`;
    case "crop":  return `<path d="M64 92 Q64 56 100 54 Q136 56 136 92 Q128 74 100 72 Q72 74 64 92 Z" fill="${c}"/>`;
    case "bald":  return `<path d="M62 106 Q60 92 66 86 L66 104 Z M138 106 Q140 92 134 86 L134 104 Z" fill="${c}"/>`;
    default:      return `<path d="M62 96 Q60 54 100 52 Q140 54 138 96 Q130 72 100 70 Q70 72 62 96 Z" fill="${c}"/>`;
  }
}
function portraitSVG(id){
  const c = CAST[id]; if(!c) return "";
  const collar = c.robe
    ? `<path d="M76 160 Q100 176 124 160 L124 152 Q100 166 76 152 Z" fill="#000"/>`
    : `<path d="M84 158 L100 190 L116 158 Z" fill="#f2efe9"/><path d="M97 166 L103 166 L105 196 L100 204 L95 196 Z" fill="${c.badge ? '#5a2430' : '#2e3a46'}"/>`;
  const badge = c.badge
    ? `<g transform="translate(140 196)"><circle r="7" fill="#d2ac62"/><circle r="3" fill="#8a6a2a"/>${[...Array(8)].map((_,i)=>`<rect x="-1" y="-10" width="2" height="4" fill="#d2ac62" transform="rotate(${i*45})"/>`).join("")}</g>` : "";
  const glasses = c.glasses
    ? `<g fill="none" stroke="#1a1512" stroke-width="2"><circle cx="85" cy="104" r="9"/><circle cx="115" cy="104" r="9"/><path d="M94 104 L106 104"/></g>` : "";
  return `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    ${c.style==="long" ? hairPath("long", c.hair) : ""}
    <path d="M18 240 Q24 170 100 158 Q176 170 182 240 Z" fill="${c.attire}"/>
    ${c.robe ? `<path d="M18 240 Q24 170 100 158 Q176 170 182 240 Z" fill="#0d0d0f"/><path d="M60 180 Q100 196 140 180" stroke="#222" stroke-width="2" fill="none"/>` : ""}
    <rect x="88" y="136" width="24" height="26" fill="${c.skin}"/>
    ${collar}
    <ellipse cx="100" cy="102" rx="38" ry="46" fill="${c.skin}"/>
    <ellipse cx="62" cy="106" rx="5" ry="9" fill="${c.skin}"/><ellipse cx="138" cy="106" rx="5" ry="9" fill="${c.skin}"/>
    ${c.style==="long" ? "" : hairPath(c.style, c.hair)}
    ${c.style==="long" ? `<path d="M62 96 Q60 52 100 50 Q140 52 138 96 Q126 72 100 72 Q74 72 62 96 Z" fill="${c.hair}"/>` : ""}
    <path d="M78 92 Q85 88 92 91 M108 91 Q115 88 122 92" stroke="#2a1f19" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="85" cy="104" rx="3" ry="3.6" fill="#1d1612"/><ellipse cx="115" cy="104" rx="3" ry="3.6" fill="#1d1612"/>
    <path d="M100 108 Q97 120 101 122" stroke="#b58b6a" stroke-width="2" fill="none"/>
    <path d="M90 132 Q100 136 110 132" stroke="#8f5b4a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    ${glasses}${badge}
  </svg>`;
}

/* =====================================================================
   背景（SVG）
   ===================================================================== */
function bgSVG(kind, opt={}){
  const W=800,H=400;
  if(kind==="court"){
    const seats = opt.panel ? [300,400,500] : [400];
    return `<svg class="bg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="${W}" height="${H}" fill="#3b2a1e"/>
      ${[...Array(20)].map((_,i)=>`<rect x="${i*40}" y="0" width="38" height="230" fill="${i%2?'#4a3424':'#45301f'}"/>`).join("")}
      <rect x="0" y="226" width="${W}" height="6" fill="#2a1c12"/>
      ${seats.map(x=>`<rect x="${x-26}" y="52" width="52" height="90" rx="6" fill="#1e1510"/><rect x="${x-22}" y="56" width="44" height="80" rx="5" fill="#5a1f22"/>`).join("")}
      <rect x="150" y="128" width="500" height="70" fill="#8a6446"/><rect x="150" y="128" width="500" height="8" fill="#a07a58"/>
      ${[...Array(10)].map((_,i)=>`<rect x="${158+i*50}" y="142" width="42" height="50" fill="#7a573b"/>`).join("")}
      <rect x="250" y="198" width="300" height="48" fill="#6e4f36"/><rect x="250" y="198" width="300" height="6" fill="#8a6446"/>
      <text x="400" y="228" fill="#d9c9b0" font-size="11" text-anchor="middle" font-family="serif" opacity=".7">書記官席</text>
      <rect x="0" y="246" width="${W}" height="154" fill="#2c211a"/>
      <rect x="30" y="268" width="210" height="60" fill="#7a573b"/><rect x="30" y="268" width="210" height="6" fill="#9a7452"/>
      <rect x="560" y="268" width="210" height="60" fill="#7a573b"/><rect x="560" y="268" width="210" height="6" fill="#9a7452"/>
      <text x="135" y="303" fill="#efe2cc" font-size="13" text-anchor="middle" font-family="serif" opacity=".75">原告席</text>
      <text x="665" y="303" fill="#efe2cc" font-size="13" text-anchor="middle" font-family="serif" opacity=".75">被告席</text>
      <rect x="370" y="290" width="60" height="44" fill="#6e4f36"/><rect x="384" y="278" width="32" height="14" fill="#2d2d2d"/>
      <text x="400" y="320" fill="#efe2cc" font-size="11" text-anchor="middle" font-family="serif" opacity=".75">証言台</text>
      <rect x="0" y="360" width="${W}" height="40" fill="#1a1410"/>
      <rect x="0" y="352" width="${W}" height="8" fill="#5e4430"/>
    </svg>`;
  }
  if(kind==="prep"){
    return `<svg class="bg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="${W}" height="${H}" fill="#cfc7b8"/>
      <rect x="0" y="260" width="${W}" height="140" fill="#6c6a64"/>

      reason: !st.flags.haishin ? "被告は先に所有権移転登記を備えた。原告は登記なくして所有権の取得を被告に対抗できない（民法177条）。" : "原告は被告の背信性を主張するが、これを認めるに足りる証拠がなく、あるいは登記名義人に対する請求として目的を達しない。",
      after:[S("c3","……先に、お金を払ったのは私なのに。"),S("boss","田所さんへの債務不履行責任の追及は残っている。だが、それで家は建たない。")]};
  },
  notes:[
    "単純悪意者は177条の第三者に含まれるが、背信的悪意者は含まれない（最判昭和43年8月2日民集22巻8号1571頁）。",
    "背信的悪意者からの転得者は、転得者自身が背信的悪意者と評価されない限り、177条の第三者として保護される（最判平成8年10月29日民集50巻9号2506頁）。",
    "処分禁止の仮処分の登記後の処分は、仮処分債権者に対抗できない（民事保全法58条1項）。保全は本案より先に打つ。",
    "登記手続を命じる判決は、確定時に意思表示が擬制され（民執法177条）、単独で申請できる（不登法63条1項）。"
  ]
};

const CHAPTERS = [CH1, CH2, CH3];

/* =====================================================================
   エンジン
   ===================================================================== */
const app = document.getElementById("app");
const STORE_KEY = "houtei-no-sentaku-v1";
function loadBest(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||"{}"); }catch(e){ return {}; } }
function saveBest(b){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(b)); }catch(e){} }

let best = Object.assign(loadBest(), window.claude?.hot?.data?.best || {});
let st = null;          // 進行中の状態
let typing = null;      // タイプライタ制御
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

window.claude?.hot?.snapshot?.(() => ({best}));

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function newState(ch){
  return {ch, frames:[{nodes:ch.nodes, i:0}], score:40, trust:60, flags:{}, scene:null, log:[], answers:[], laws:new Set(), checkpoint:null, speaker:null};
}

/* ---------- タイトル ---------- */
function renderTitle(){
  st = null;
  const gradeOf = id => best[id] ? best[id].grade : "—";
  app.innerHTML = `
  <div class="title-wrap fade-in">
    <div class="title-mark"><h1>法廷の選択</h1><span class="sub">民法・民事訴訟法　実務シミュレーション</span></div>
    <p class="lede">あなたは弁護士登録して半年の新人、朝倉遥。有名判例をもとにした三つの事件で、依頼人の代理人として法廷に立ちます。答弁書を出すか、どの主張を立てるか、尋問で何を聞くか。手続と主張の選択の一つ一つが、判決主文を変えていきます。</p>
    <div class="chapters">
      ${CHAPTERS.map((c,i)=>`
        <button class="chap" data-ch="${i}">
          <span class="no">${c.no}</span>
          <span style="min-width:0">
            <h3>第${c.no}章　${c.title}</h3>
            <div class="meta">${c.court}　／　${c.role}</div>
            <div class="case">題材：${c.basis}</div>
          </span>
          <span class="best">${gradeOf(c.id)}<small>最高評価</small></span>
        </button>`).join("")}
    </div>
    <div class="howto">
      <div><b>心証（推定）</b>裁判所があなたの主張をどう受け止めているかの目安です。判決はこの値と、勝負どころの主張を出せたかで決まります。</div>
      <div><b>依頼人の信頼</b>報告、相談、依頼人の目的に沿った判断で上がります。独断で動くと、解任されることもあります。</div>
      <div><b>◎○△✕と解説</b>選択のたびに、条文と判例に基づく解説が出ます。致命的な悪手を選んでも、その選択の直前からやり直せます。</div>
    </div>
    <p class="disclaimer">登場人物・事件はすべて架空です。事案は判例を学習用に単純化して再構成したもので、実際の判決の当事者や事実関係とは異なります。条文・判例は令和8年時点の理解に基づいていますが、学習用の目安として扱い、実務では必ず原典を確認してください。</p>
  </div>`;
  app.querySelectorAll(".chap").forEach(b=>b.onclick=()=>startChapter(CHAPTERS[+b.dataset.ch]));
}

function startChapter(ch){
  st = newState(ch);
  step();
}

/* ---------- 進行 ---------- */
function curNode(){
  while(st.frames.length){
    const f = st.frames[st.frames.length-1];
    if(f.i < f.nodes.length) return f.nodes[f.i];
    st.frames.pop();
  }
  return null;
}
function advance(){ st.frames[st.frames.length-1].i++; }
function push(nodes){ if(nodes && nodes.length) st.frames.push({nodes, i:0}); }

function step(){
  const n = curNode();
  if(!n){ return renderResult(); }
  switch(n.t){
    case "scene": st.scene = n; st.speaker=null; advance(); return step();
    case "if": advance(); push(st.flags[n.flag] ? n.then : n.els); return step();
    case "say": case "narr": return renderLine(n);
    case "doc": return renderDoc(n);
    case "choice": return renderChoice(n);
    case "verdict": return renderVerdict();
  }
}

/* ---------- 共通レイアウト ---------- */
function hud(){
  const sc = st.scene || {};
  return `<div class="hud">
    <div class="where"><div class="court">第${st.ch.no}章　${st.ch.title}</div><div class="date">${esc(st.ch.caseName)}${sc.date?"　｜　"+esc(sc.date):""}</div></div>
    <div class="meters">
      <div class="meter"><span>心証（推定）　${Math.round(clamp(st.score))}</span><div class="bar"><i style="width:${clamp(st.score)}%"></i></div></div>
      <div class="meter trust"><span>依頼人の信頼　${Math.round(st.trust)}</span><div class="bar"><i style="width:${clamp(st.trust)}%"></i></div></div>
      <div class="hud-btns"><button class="ghost" id="b-roppo">六法</button><button class="ghost" id="b-log">記録</button><button class="ghost" id="b-menu">中断</button></div>
    </div>
  </div>`;
}
function clamp(v){ return Math.max(0, Math.min(100, v)); }
function stage(who, slim){
  const sc = st.scene || {bg:"office", place:""};
  const isLeft = who==="me" || who==="boss";
  return `<div class="stage${slim?" slim":""}">
    ${bgSVG(sc.bg, {panel: st.ch.panel})}
    <div class="place">${esc(sc.place||"")}</div>
    <div class="portrait ${isLeft?"left":"right"} ${who?"":"hide"}">${who?portraitSVG(who):""}</div>
  </div>`;
}
function wireHud(){
  document.getElementById("b-roppo").onclick = showRoppo;
  document.getElementById("b-log").onclick = showLog;
  document.getElementById("b-menu").onclick = showMenu;
}

/* ---------- 台詞 ---------- */
function renderLine(n){
  const who = n.t==="say" ? n.who : null;
  const c = who ? CAST[who] : null;
  st.log.push({who: c ? c.name : "", text:n.text});
  app.innerHTML = hud() + stage(who) + `
    <div class="box" id="box" role="button" tabindex="0" aria-label="次へ">
      ${c?`<div class="name">${esc(c.name)}<small>${esc(c.role)}</small></div>`:""}
      <div class="text ${c?"":"narr"}" id="txt"></div>
      <div class="next" id="nx" hidden>クリックで次へ</div>
    </div>`;
  wireHud();
  const box = document.getElementById("box"), txt = document.getElementById("txt"), nx = document.getElementById("nx");
  let i = 0; const full = n.text;
  const done = () => { clearInterval(typing); typing=null; txt.textContent = full; nx.hidden=false; };
  if(reduce){ done(); } else { typing = setInterval(()=>{ i+=2; txt.textContent = full.slice(0,i); if(i>=full.length) done(); }, 22); }
  const go = () => { if(typing){ done(); return; } advance(); step(); };
  box.onclick = go;
  box.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
  box.focus({preventScroll:true});
}

/* ---------- 書面 ---------- */
function renderDoc(n){
  app.innerHTML = hud() + `
    <div class="doc fade-in"><h4>${n.title}</h4><div class="caseline">${esc(n.caseline)}</div>${n.html}</div>
    <button class="primary" id="go">書面を閉じる</button>`;
  wireHud();
  document.getElementById("go").onclick = () => { advance(); step(); };
}

/* ---------- 選択肢 ---------- */
function renderChoice(n){
  st.checkpoint = snapshotState();
  app.innerHTML = hud() + stage(null, true) + `
    <div class="choice fade-in">
      <div class="q"><span class="kind">${esc(n.kind)}</span>${esc(n.prompt)}</div>
      <div class="opts">${n.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${o.k}</span><span>${esc(o.label)}</span></button>`).join("")}</div>
    </div>`;
  wireHud();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(n, n.opts[+b.dataset.i]));
}
function snapshotState(){
  return {frames: st.frames.map(f=>({nodes:f.nodes, i:f.i})), score:st.score, trust:st.trust, flags:{...st.flags}, scene:st.scene, answers:[...st.answers], logLen: st.log.length};
}
function restoreCheckpoint(){
  const c = st.checkpoint;
  st.frames = c.frames.map(f=>({nodes:f.nodes, i:f.i}));
  st.score=c.score; st.trust=c.trust; st.flags={...c.flags}; st.scene=c.scene; st.answers=[...c.answers]; st.log.length = c.logLen;
  step();
}
function choose(n, o){
  (o.laws||[]).forEach(l=>st.laws.add(l));
  const g = G[o.g];
  if(o.fatal){ return renderGameOver(n, o); }
  st.score = st.score + (o.d||0);  // 内部値は上限なし（表示のみ0〜100）
  st.trust = clamp(st.trust + (o.t||0));
  if(o.flag) st.flags[o.flag] = true;
  st.answers.push({q:n.prompt, k:o.k, label:o.label, g:o.g});
  st.log.push({who:"選択", text:`${n.prompt}\n→ ${o.k}. ${o.label}`});
  const sign = v => (v>0?"+":"")+v;
  app.innerHTML = hud() + `
    <div class="fb fade-in">
      <div class="head"><span class="mark ${g.c}">${g.m}</span><div><div class="verdict ${g.c}">${g.l}</div><div class="delta">心証 ${sign(o.d||0)}　／　依頼人の信頼 ${sign(o.t||0)}</div></div></div>
      <div class="pick">${o.k}．${esc(o.label)}</div>
      <div class="exp">${esc(o.exp)}</div>
      ${(o.laws&&o.laws.length)?`<div class="laws">${o.laws.map(l=>`<span class="law">${esc(l)}</span>`).join("")}</div>`:""}
      <div class="btnrow">${o.g!=="best"?`<button class="ghost" id="retry">この選択をやり直す</button>`:""}<button class="primary" id="go">続ける</button></div>
    </div>`;
  wireHud();
  document.getElementById("go").onclick = () => { advance(); step(); };
  const r = document.getElementById("retry"); if(r) r.onclick = restoreCheckpoint;
}

/* ---------- ゲームオーバー ---------- */
function renderGameOver(n, o){
  app.innerHTML = `
    <div class="result fade-in">
      <p class="big lose">敗　北</p>
      <div class="doc"><p style="white-space:pre-wrap">${esc(o.over)}</p></div>
      <div class="fb">
        <div class="head"><span class="mark g-bad">✕</span><div class="verdict g-bad">致命的な選択</div></div>
        <div class="pick">${o.k}．${esc(o.label)}</div>
        <div class="exp">${esc(o.exp)}</div>
        <div class="laws">${(o.laws||[]).map(l=>`<span class="law">${esc(l)}</span>`).join("")}</div>
      </div>
      <div class="btnrow"><button class="ghost" id="menu">タイトルへ</button><button class="primary" id="retry">この選択の直前からやり直す</button></div>
    </div>`;
  document.getElementById("retry").onclick = restoreCheckpoint;
  document.getElementById("menu").onclick = renderTitle;
}

/* ---------- 判決 ---------- */
function renderVerdict(){
  const v = st.ch.verdict(st);
  st.result = v;
  const judge = st.ch.id==="ch1"?"j1":st.ch.id==="ch2"?"j2":"j3";
  app.innerHTML = hud() + stage(judge) + `
    <div class="box" style="cursor:default"><div class="name">${esc(CAST[judge].name)}<small>${esc(CAST[judge].role)}</small></div>
      <div class="text">${v.kind==="mid" ? "本件は、和解が成立しましたので、その内容を確認します。" : "それでは判決を言い渡します。主文。"}</div></div>
    <div class="doc fade-in">
      <h4>${v.kind==="mid"?"和解条項":"判　　決"}</h4>
      <div class="caseline">${esc(st.ch.caseName)}</div>
      <p class="sec">${v.kind==="mid"?"和解条項":"主　文"}</p>
      ${v.main.map(m=>`<p>${esc(m)}</p>`).join("")}
      <p class="sec">${v.kind==="mid"?"経　緯":"理由の要旨"}</p>
      <p>${esc(v.reason)}</p>
    </div>
    <p class="big ${v.kind}" style="font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,44px);letter-spacing:.2em;text-align:center;margin:4px 0" >${v.label}</p>
    <button class="primary" id="go">続ける</button>`;
  wireHud();
  document.getElementById("go").onclick = () => { advance(); push(v.after); step(); };
}

/* ---------- 章の結果 ---------- */
function renderResult(){
  const v = st.result || {kind:"lose", label:"—"};
  const counts = {best:0, ok:0, meh:0, bad:0};
  st.answers.forEach(a=>counts[a.g]++);
  const total = st.answers.length || 1;
  const ratio = (counts.best + counts.ok*0.5)/total;
  let grade = v.kind==="win" ? (ratio>=0.95?"S":ratio>=0.8?"A":"B") : v.kind==="mid" ? "C" : "D";
  const prev = best[st.ch.id];
  const order = "DCBAS";
  if(!prev || order.indexOf(grade) > order.indexOf(prev.grade)){ best[st.ch.id] = {grade}; saveBest(best); }
  const idx = CHAPTERS.indexOf(st.ch);
  const nextCh = CHAPTERS[idx+1];
  app.innerHTML = `
  <div class="result fade-in">
    <div class="title-mark"><h1 style="font-size:clamp(26px,5vw,40px)">第${st.ch.no}章　${st.ch.title}</h1><span class="sub">事件記録の総括</span></div>
    <p class="big ${v.kind}">${v.label}</p>
    <div class="stats">
      <div class="stat"><div class="l">総合評価</div><div class="v">${grade}</div></div>
      <div class="stat"><div class="l">心証（推定）</div><div class="v">${Math.round(clamp(st.score))}</div></div>
      <div class="stat"><div class="l">依頼人の信頼</div><div class="v">${Math.round(st.trust)}</div></div>
      <div class="stat"><div class="l">最善手</div><div class="v">${counts.best} / ${st.answers.length}</div></div>
    </div>
    <div class="notes">
      <h4>あなたの選択</h4>
      <div class="review">${st.answers.map(a=>`<div class="row"><span class="${G[a.g].c}">${G[a.g].m}</span><div>${esc(a.q)}<br><span style="color:var(--muted)">${a.k}．${esc(a.label)}</span></div></div>`).join("")}</div>
    </div>
    <div class="notes">
      <h4>判例ノート</h4>
      <ul>${st.ch.notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    </div>
    <div class="btnrow">
      <button class="ghost" id="t">タイトルへ</button>
      <button class="ghost" id="r">もう一度この章を</button>
      ${nextCh?`<button class="primary" id="n">第${nextCh.no}章へ</button>`:""}
    </div>
  </div>`;
  document.getElementById("t").onclick = renderTitle;
  document.getElementById("r").onclick = () => startChapter(st.ch);
  if(nextCh) document.getElementById("n").onclick = () => startChapter(nextCh);
  window.scrollTo({top:0});
}

/* ---------- モーダル ---------- */
function modal(html){
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}<div class="btnrow" style="margin-top:14px"><button class="primary" id="mclose">閉じる</button></div></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelector("#mclose").onclick = close;
  m.onclick = e => { if(e.target===m) close(); };
  m.querySelector("#mclose").focus();
}
const ROPPO = {
  "民法612条":"賃借人は、賃貸人の承諾を得なければ、賃借権を譲り渡し、又は賃借物を転貸できない（1項）。違反して第三者に使用・収益させたとき、賃貸人は契約を解除できる（2項）。",
  "民法94条2項":"相手方と通じてした虚偽の意思表示の無効は、善意の第三者に対抗できない。不実登記の事案に類推適用される。",
  "民法110条":"代理人が権限外の行為をした場合に、第三者が代理人の権限があると信ずべき正当な理由があるときは、表見代理が成立する。94条2項と併せて類推されると、第三者に善意無過失が求められる。",
  "民法177条":"不動産に関する物権の得喪・変更は、登記をしなければ第三者に対抗できない。背信的悪意者は「第三者」に当たらない。",
  "民法192条":"取引行為によって平穏・公然に動産の占有を始めた者は、善意無過失であれば、即時にその動産の権利を取得する（即時取得）。不動産には適用されない。",
  "民訴158条":"最初の口頭弁論期日に当事者の一方が欠席したとき、裁判所は、その者が提出した訴状・答弁書等の記載事項を陳述したものとみなせる。",
  "民訴159条":"相手方の主張した事実を争うことを明らかにしないときは、自白したものとみなす（1項）。期日に出頭しない場合にも準用される（3項）。",
  "民訴179条":"裁判所において当事者が自白した事実と、顕著な事実は、証明を要しない。",
  "民訴157条":"故意又は重大な過失により時機に後れて提出した攻撃防御方法は、訴訟の完結を遅延させるときは、却下できる。",
  "民訴53条":"当事者は、訴訟の係属中、参加できる第三者に訴訟告知ができる。告知を受けた者が参加しなくても、46条の効力（参加的効力）が及ぶ（4項）。",
  "民訴89条":"裁判所は、訴訟がいかなる程度にあるかを問わず、和解を試みることができる。",
  "民訴285条":"控訴は、判決書の送達を受けた日から2週間の不変期間内に提起しなければならない。",
  "民訴規則114条・115条":"反対尋問の範囲（114条）と、誘導・侮辱・意見を求める質問などの制限（115条）。",
  "民事保全法13条・14条":"保全命令の申立てでは保全すべき権利と保全の必要性を疎明する（13条）。保全命令は担保を立てさせて発令できる（14条）。",
  "民事保全法58条":"処分禁止の仮処分の登記後にされた登記に係る権利の取得・処分は、仮処分債権者に対抗できない（1項）。",
  "民事執行法177条":"意思表示を命じる判決は、確定した時に意思表示をしたものとみなす。",
  "不動産登記法63条1項":"登記手続を命じる確定判決による登記は、登記権利者が単独で申請できる。"
};
function showRoppo(){
  modal(`<h3>ポケット六法</h3><dl>${Object.entries(ROPPO).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    ${st && st.laws.size ? `<h3 style="margin-top:16px">この章で出てきた条文・判例</h3><div class="laws">${[...st.laws].map(l=>`<span class="law">${esc(l)}</span>`).join("")}</div>`:""}`);
}
function showLog(){
  modal(`<h3>記録</h3>${st.log.slice(-60).map(l=>`<div class="logline">${l.who?`<b>${esc(l.who)}</b>`:""}<span style="white-space:pre-wrap">${esc(l.text)}</span></div>`).join("")}`);
}
function showMenu(){
  modal(`<h3>中断しますか</h3><p>章の途中経過は保存されません。タイトルに戻ると、この章は最初からになります。</p><div class="btnrow"><button class="ghost" id="toTitle">タイトルへ戻る</button></div>`);
  document.getElementById("toTitle").onclick = () => { document.querySelector(".modal")?.remove(); if(typing){clearInterval(typing);typing=null;} renderTitle(); };
}

const boot = () => renderTitle();
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
</script>
